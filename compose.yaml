services:
  web:
    image: node:24-bookworm-slim
    working_dir: /app

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command:
      sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

    environment:
      NODE_ENV: development

volumes:
  node_modules: